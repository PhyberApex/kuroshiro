name: kuroshiro
services:
  db:
    image: postgres:18-alpine
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${KUROSHIRO_DB_USER}
      POSTGRES_PASSWORD: ${KUROSHIRO_DB_PASSWORD}
      POSTGRES_DB: ${KUROSHIRO_DB_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d test"]
      interval: 5s
      timeout: 5s
      retries: 5
#    volumes:
#      - postgres_data:/var/lib/postgresql/data
  app:
    build: .
#    image: ghcr.io/phyberapex/kuroshiro:latest
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - '80:${KUROSHIRO_PORT}'
    environment:
      KUROSHIRO_PORT: ${KUROSHIRO_PORT}
      KUROSHIRO_API_URL: ${KUROSHIRO_API_URL}
      KUROSHIRO_DB_HOST: db
      KUROSHIRO_DB_PORT: 5432
      KUROSHIRO_DB_USER: ${KUROSHIRO_DB_USER}
      KUROSHIRO_DB_PASSWORD: ${KUROSHIRO_DB_PASSWORD}
      KUROSHIRO_DB_DB: ${KUROSHIRO_DB_DB}
      KUROSHIRO_APPRISE_URL: ${KUROSHIRO_APPRISE_URL}
      KUROSHIRO_APPRISE_KEY: ${KUROSHIRO_APPRISE_KEY}
      KUROSHIRO_ALERT_LOW_BATTERY_PERCENT: ${KUROSHIRO_ALERT_LOW_BATTERY_PERCENT}
      KUROSHIRO_ALERT_OFFLINE_MULTIPLIER: ${KUROSHIRO_ALERT_OFFLINE_MULTIPLIER}
#    volumes:
#      - kuroshiro_data:/app/public/screens/devices
# Uncomment to enable Alert notifications (see the "Alerts" section of the README)
# and point KUROSHIRO_APPRISE_URL above at http://apprise-api:8000.
#  apprise-api:
#    image: caronc/apprise:latest
#    restart: always
#    ports:
#      - '8000:8000'
#    volumes:
#      - apprise_data:/config
volumes:
  postgres_data:
  kuroshiro_data:
  apprise_data:
