<!doctype html>
<html lang="en">
  <head>
    <!-- The API writes its own <base>, with the prefix the UI is served under, before this one; the first wins. This one serves the dev server, which writes none. -->
    <base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <!-- The first place a cascade layer is named fixes its order, and a build can put component styles ahead of styles/index.css. -->
    <style>@layer reset, base, components;</style>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Kuroshiro</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
