<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE: Kuroshiro app shell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700&family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; }
body, h1, h2, h3, p, ul, ol, figure, dl, dd { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; }
svg { display: block; }

html { --font-b: "Archivo", system-ui, sans-serif; --font-m: "JetBrains Mono", monospace; --paper: #fff; scrollbar-color: var(--mid) transparent; }
html.light { --bg: #fff; --fg: #121212; --mid: #666; --rule: #d9d9d9; --wash: #f1f1f1; --seal: #c4242f; color-scheme: light; }
html.dark { --bg: #121212; --fg: #f4f4f4; --mid: #9c9c9c; --rule: #363636; --wash: #1f1f1f; --seal: #e5484d; color-scheme: dark; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-b); font-size: 14px; line-height: 1.45; font-variant-numeric: tabular-nums; caret-color: var(--fg); }
::selection { background: var(--fg); color: var(--bg); }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; border-radius: 3px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.icon { width: 16px; height: 16px; fill: currentColor; }
.mono { font-family: var(--font-m); font-size: 13px; }
.mid { color: var(--mid); }

/* ───────── shared page parts ───────── */
h1 { font-stretch: 68%; font-weight: 800; font-size: 48px; line-height: 0.95; letter-spacing: -0.015em; text-wrap: balance; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px 24px; flex-wrap: wrap; }
.head .actions { display: flex; gap: 8px; }
.h2 { font-stretch: 75%; font-weight: 700; font-size: 22px; line-height: 1.1; padding-bottom: 8px; border-bottom: 2px solid var(--fg); margin-top: 40px; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
.h2 a { text-decoration: none; }
.h2 a:hover { text-decoration: underline; text-underline-offset: 3px; }
.lede { margin: 12px 0 16px; max-width: 62ch; color: var(--mid); font-size: 15px; }
.seal { flex: none; color: var(--fg); }
.seal.red { color: var(--seal); }
.lock { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.word { font-stretch: 68%; font-weight: 800; font-size: 22px; line-height: 1; letter-spacing: -0.015em; }

.btn { display: inline-flex; align-items: center; font-weight: 600; font-size: 13px; padding: 7px 12px; border: 1px solid var(--fg); border-radius: 3px; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--wash); }
.btn.primary { background: var(--fg); color: var(--bg); }
.btn.primary:hover { background: var(--mid); border-color: var(--mid); }
.btn.quiet { border-color: transparent; padding-inline: 0; text-decoration: underline; text-underline-offset: 3px; font-weight: 500; }
.btn.quiet:hover { background: none; color: var(--mid); }

.tabs { display: flex; gap: 20px; margin-top: 24px; border-bottom: 1px solid var(--rule); overflow-x: auto; scrollbar-width: none; }
.tabs a { padding: 8px 0; text-decoration: none; color: var(--mid); font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs a:hover { color: var(--fg); }
.tabs a[aria-current] { color: var(--fg); font-weight: 600; border-bottom-color: var(--fg); }

.item { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 3px; text-decoration: none; font-weight: 500; }
.item:hover { background: var(--wash); }
.item[aria-current] { background: var(--fg); color: var(--bg); font-weight: 600; }
.item small { font-family: var(--font-m); font-size: 12px; color: var(--mid); }
.item[aria-current] small { color: inherit; }

.alertlink { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; text-decoration: none; white-space: nowrap; }
.alertlink::before { content: ""; width: 8px; height: 8px; background: var(--fg); flex: none; }
.alertlink:hover { text-decoration: underline; text-underline-offset: 3px; }

.facts { display: flex; flex-wrap: wrap; gap: 12px 0; margin-top: 20px; }
.facts div { padding: 0 20px; border-left: 1px solid var(--rule); }
.facts div:first-child { padding-left: 0; border-left: 0; }
.facts dt { font-size: 12px; color: var(--mid); }
.facts dd { font-family: var(--font-m); font-size: 13px; margin-top: 2px; }
.fault { color: var(--seal); font-weight: 500; }
.fault::before { content: ""; display: inline-block; width: 8px; height: 8px; background: var(--seal); margin-right: 6px; }

.plate, .thumb { position: relative; background: var(--paper); aspect-ratio: 800 / 480; }
.plate svg, .thumb svg { width: 100%; height: 100%; }
.thumb { flex: none; outline: 1px solid var(--rule); border-radius: 2px; }
.now { margin-top: 24px; max-width: 600px; position: relative; }
.now .plate { outline: 2px solid var(--fg); border-radius: 2px; }
.now .seal { position: absolute; top: -14px; right: -14px; transform: rotate(4deg); }
.now figcaption { margin-top: 12px; display: flex; justify-content: space-between; gap: 4px 16px; flex-wrap: wrap; color: var(--mid); font-size: 13px; }
.now figcaption b { color: var(--fg); font-weight: 600; }

.rows > li { border-bottom: 1px solid var(--rule); }
.srow { display: grid; grid-template-columns: 16px 20px 72px minmax(0, 1fr) 200px 124px 16px; gap: 14px; align-items: center; padding: 8px 0; }
.srow .grip, .menu { color: var(--mid); }
.srow .ord { font-family: var(--font-m); font-size: 13px; color: var(--mid); }
.srow .thumb { width: 72px; }
.name { font-weight: 600; }
.kind { color: var(--mid); margin-left: 8px; font-size: 13px; }
.sched { display: flex; gap: 10px; align-items: baseline; font-family: var(--font-m); font-size: 12px; }
.days { letter-spacing: 0.2em; color: var(--rule); }
.days b { color: var(--fg); font-weight: 500; }
.srow .state { font-size: 13px; color: var(--mid); display: flex; align-items: center; gap: 8px; }
.srow.active .state { color: var(--fg); font-weight: 600; }
.srow.active .ord { color: var(--fg); }
.srow.off .name, .srow.off .days b { color: var(--mid); }
.srow.off .thumb { opacity: 0.4; }
.srow.off .sched { text-decoration: line-through; color: var(--mid); }

.drow { display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 20px; align-items: center; padding: 14px 0; text-decoration: none; }
.drow:hover .dname { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 2px; }
.dname { font-stretch: 75%; font-weight: 700; font-size: 26px; line-height: 1.1; display: block; }
.dfacts { display: block; margin-top: 6px; color: var(--mid); }

.prow { display: grid; grid-template-columns: minmax(0, 1.4fr) 80px minmax(0, 1fr) minmax(0, 1fr) 16px; gap: 16px; align-items: center; padding: 11px 0; }
.prow a { text-decoration: none; }
.prow a:hover { text-decoration: underline; text-underline-offset: 3px; }
.prow span { color: var(--mid); font-size: 13px; }
.prow .streak { color: var(--fg); font-weight: 500; }

.set { display: grid; grid-template-columns: 220px minmax(0, 1fr) auto; gap: 16px; align-items: baseline; padding: 10px 0; }
.set b { font-weight: 500; }
details.tucked { margin-top: 40px; border-top: 1px solid var(--rule); }
details.tucked + details.tucked { margin-top: 0; }
details.tucked:last-of-type { border-bottom: 1px solid var(--rule); }
details.tucked summary { padding: 12px 0; font-weight: 600; cursor: pointer; }
details.tucked > :not(summary) { margin-bottom: 16px; }

.logs { margin-top: 20px; font-family: var(--font-m); font-size: 12.5px; }
.logs li { display: grid; grid-template-columns: 72px 48px minmax(0, 1fr); gap: 12px; padding: 7px 0; }
.logs time, .logs .lvl { color: var(--mid); }

.irow { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px; padding: 12px 0; text-decoration: none; }
.irow:hover b { text-decoration: underline; text-underline-offset: 3px; }
.irow b { font-weight: 600; }
.irow span { color: var(--mid); }
.cols { columns: 2; column-gap: 40px; }
.cols li { break-inside: avoid; }
.cols .irow { grid-template-columns: minmax(0, 1fr) auto; padding: 10px 0; }

.arow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; padding: 12px 0; align-items: baseline; }
.arow p { grid-column: 1; color: var(--mid); }
.arow .btn { grid-row: 1 / 3; grid-column: 2; align-self: center; }

.code { margin-top: 16px; padding: 14px 16px; border: 1px solid var(--rule); border-radius: 3px; font-family: var(--font-m); font-size: 12.5px; line-height: 1.6; white-space: pre; overflow-x: auto; }
.editor { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; margin-top: 8px; }
.editor .code { margin-top: 16px; }
.editor .now { margin-top: 16px; }

.url { margin-top: 28px; display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; padding: 20px 24px; outline: 2px solid var(--fg); border-radius: 2px; max-width: 720px; }
.url code { font-family: var(--font-m); font-weight: 500; font-size: 28px; line-height: 1.2; overflow-wrap: anywhere; }
.waiting { margin-top: 20px; display: flex; align-items: center; gap: 10px; font-weight: 600; }
.waiting i { width: 10px; height: 10px; background: var(--fg); animation: wait 1.2s steps(2, jump-none) infinite; }
@keyframes wait { to { opacity: 0.15; } }
.arrived { margin-top: 20px; display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 20px; align-items: center; max-width: 720px; }
.arrived .thumb { outline: 2px solid var(--fg); }
.arrived .seal { position: absolute; top: -10px; right: -10px; animation: stamp 320ms cubic-bezier(0.16, 1, 0.3, 1) both; }
@keyframes stamp { from { transform: scale(1.9) rotate(-10deg); opacity: 0; } to { transform: scale(1) rotate(4deg); opacity: 1; } }
.arrived b { font-stretch: 75%; font-weight: 700; font-size: 22px; display: block; }
.arrived .btn { margin-top: 12px; }
.also { margin-top: 40px; max-width: 62ch; }
.field { display: grid; gap: 4px; max-width: 320px; margin-bottom: 12px; }
.field span { font-weight: 500; }
.field input { padding: 7px 10px; border: 1px solid var(--mid); border-radius: 3px; background: var(--bg); font-family: var(--font-m); font-size: 13px; }
.stub { margin-top: 32px; padding-top: 12px; border-top: 1px dashed var(--rule); color: var(--mid); font-size: 13px; max-width: 62ch; }
@media (prefers-reduced-motion: reduce) { .waiting i, .arrived .seal { animation: none; } }

/* ───────── A. Rail: everything that navigates lives in one left column ───────── */
.A { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.A-rail { border-right: 1px solid var(--rule); padding: 20px 12px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.A-rail .lock { padding: 0 8px 16px; }
.A-rail h2 { margin: 12px 8px 6px; font-size: 12px; font-weight: 600; color: var(--mid); text-transform: uppercase; letter-spacing: 0.06em; }
.A-rail hr { border: 0; border-top: 1px solid var(--rule); margin: 12px 8px; }
.A-rail .open { font-weight: 700; }
.A-rail .nest { margin: 0 0 6px 15px; padding-left: 8px; border-left: 1px solid var(--rule); display: grid; gap: 2px; }
.A-rail .nest .item { padding-block: 5px; }
.A-rail .add:not([aria-current]) { color: var(--mid); }
.A-rail .foot { margin-top: auto; padding: 16px 8px 0; }
.A-rail .close, .A-top { display: none; }
.A-main { padding: 36px 40px 120px; }
.A-main > div { max-width: 920px; }
.A-main .tabs { display: none; }

/* ───────── B. Masthead: one bar across the top, second level in the page ───────── */
.B-bar { display: flex; align-items: stretch; gap: 28px; height: 52px; padding: 0 24px; border-bottom: 1px solid var(--rule); position: sticky; top: 0; background: var(--bg); z-index: 2; }
.B-bar nav { display: flex; gap: 22px; align-items: stretch; }
.B-bar nav a { display: flex; align-items: center; text-decoration: none; color: var(--mid); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.B-bar nav a:hover { color: var(--fg); }
.B-bar nav a[aria-current] { color: var(--fg); font-weight: 600; border-bottom-color: var(--fg); }
.B-bar nav i { width: 1px; background: var(--rule); margin: 14px 0; }
.B-bar .alertlink { margin-left: auto; }
.B-col { max-width: 968px; margin: 0 auto; padding: 44px 24px 120px; }
.B-split { display: grid; grid-template-columns: 216px minmax(0, 1fr); gap: 40px; margin-top: 28px; align-items: start; }
.B-split > nav { display: grid; gap: 2px; margin-left: -8px; }
.B-split .h2 { margin-top: 0; align-items: center; }
.h2 .actions { display: flex; gap: 8px; }
.B-tabs { display: none; }

/* ───────── C. Contents: no navigation chrome, the seal opens a contents page ───────── */
.C { max-width: 968px; margin: 0 auto; padding: 0 24px 120px; }
.C-head { display: flex; align-items: center; gap: 10px; padding: 18px 0; flex-wrap: wrap; }
.C-head .crumb { color: var(--mid); text-decoration: none; font-weight: 500; }
.C-head .crumb::before { content: "/"; color: var(--rule); margin-right: 10px; }
.C-head .crumb:hover { color: var(--fg); }
.C-head .alertlink { margin-left: auto; }
.C main { padding-top: 28px; }

@media (max-width: 820px) {
  h1 { font-size: 38px; }
  .srow { grid-template-columns: 20px 64px minmax(0, 1fr) 16px; }
  .srow .thumb { width: 64px; }
  .srow .grip { display: none; }
  .srow .sched, .srow .state { grid-column: 3; }
  .srow .menu { grid-column: 4; grid-row: 1; }
  .now .seal { right: 8px; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  .facts div { padding: 0; border: 0; }
  .cols .irow { grid-template-columns: minmax(0, 1fr) auto; }
  .drow { grid-template-columns: 112px minmax(0, 1fr); gap: 14px; }
  .dname { font-size: 22px; }
  .prow { grid-template-columns: minmax(0, 1fr) 16px; gap: 2px 12px; }
  .prow span { grid-column: 1; }
  .prow .menu { grid-column: 2; grid-row: 1; }
  .set { grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; }
  .set span { grid-column: 1; }
  .set .btn { grid-column: 2; grid-row: 1 / 3; align-self: center; }
  .irow { grid-template-columns: 1fr; gap: 2px; }
  .cols { columns: 1; }
  .editor, .arrived { grid-template-columns: 1fr; }
  .arrived .thumb { max-width: 220px; }
  .url { padding: 16px; }
  .url code { font-size: 19px; }

  .A { display: block; }
  .A-top { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--rule); position: sticky; top: 0; background: var(--bg); z-index: 2; }
  .A-top .where { font-weight: 600; margin-right: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .A-rail { display: none; }
  .A.menu-open .A-rail { display: flex; position: fixed; inset: 0; z-index: 3; height: auto; background: var(--bg); border: 0; padding: 12px 12px 96px; }
  .A.menu-open .A-rail .lock { padding-bottom: 12px; }
  .A-rail .close { display: inline-flex; position: absolute; top: 10px; right: 16px; }
  .A-rail .item { padding-block: 11px; font-size: 16px; }
  .A-main { padding: 24px 16px 150px; }
  .A-main .tabs { display: flex; }

  .B-bar { padding: 0 16px; height: 48px; }
  .B-bar nav { display: none; }
  .B-col { padding: 24px 16px 190px; }
  .B-split { grid-template-columns: 1fr; gap: 20px; margin-top: 16px; }
  .B-split > nav { display: flex; gap: 16px; margin: 0; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--rule); }
  .B-split > nav .item { padding: 8px 0; border-radius: 0; background: none; color: var(--mid); white-space: nowrap; border-bottom: 2px solid transparent; }
  .B-split > nav .item[aria-current] { color: var(--fg); border-bottom-color: var(--fg); }
  .B-tabs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; background: var(--bg); border-top: 1px solid var(--rule); padding-bottom: env(safe-area-inset-bottom); }
  .B-tabs a { padding: 15px 4px 17px; text-align: center; text-decoration: none; font-weight: 500; color: var(--mid); border-top: 2px solid transparent; margin-top: -1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .B-tabs a[aria-current] { color: var(--fg); font-weight: 700; border-top-color: var(--fg); }

  .C { padding: 0 16px 150px; }
  .C-head { padding: 12px 0; }
  .C main { padding-top: 16px; }
}

/* ───────── prototype switcher, not part of any variant ───────── */
.proto-bar { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 10; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 4px; padding: 6px; border-radius: 22px; background: #1f3fff; color: #fff; font: 600 13px/1 system-ui, sans-serif; box-shadow: 0 6px 24px rgb(0 0 0 / 0.35); white-space: nowrap; max-width: calc(100vw - 16px); }
.proto-bar button { height: 32px; min-width: 32px; padding: 0 10px; border-radius: 999px; }
.proto-bar button:hover, .proto-bar button:focus-visible { background: rgb(255 255 255 / 0.22); outline: none; }
.proto-bar .label { padding: 0 6px; min-width: 104px; text-align: center; }
.proto-bar .sep { width: 1px; height: 18px; background: rgb(255 255 255 / 0.4); margin: 0 2px; }
@media (max-width: 820px) { .proto-bar { bottom: 64px; } }
</style>
</head>
<body>
<!--
PROTOTYPE, throwaway. Wayfinder ticket "App shell and navigation" (#1080), map "Admin UI rebuild from zero" (#1074).
Three shells in the approved Hanko identity, switchable via ?variant=a|b|c, on one shared set of stubbed pages.
Also ?theme=light|dark, ?devices=0|1|3 (0 is first-run) and ?alert=0|1. All Device data is synthetic.

THESIS: the shell gets out of the way of one Device; it refuses the dashboard-of-cards landing and schema-shaped navigation.
OWN-WORLD: Hanko. Ink on paper, 1 px rules with 2 px under headings, condensed heavy Archivo titles, mono values, an ink seal in the shell, vermilion only on the Active Screen's seal and a firing Alert.
STORY: the admin lands on what the Device shows now, and reaches Plugins, Instance or another Device in one move.
FIRST VIEWPORT: Device name as the title, fact strip, the Current Screen plate with the seal on its corner. A: 232 px rail carrying all navigation. B: 52 px bar, centred column, bottom tabs on phone. C: seal and breadcrumb only, a contents page behind the seal.
FORM: A Rail, B Masthead, C Contents. No dice were rolled: the world was fixed at the brand gate and this project has no PRODUCT.md.
-->

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="d50" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#0a0a0a"/><rect x="2" y="2" width="2" height="2" fill="#0a0a0a"/></pattern>
    <pattern id="d25" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#0a0a0a"/></pattern>
    <pattern id="dh" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="2" fill="#0a0a0a"/></pattern>

    <symbol id="s-calendar" viewBox="0 0 800 480">
      <g fill="#0a0a0a" font-family="Helvetica, Arial, sans-serif">
        <text x="40" y="84" font-size="30" font-weight="700">Thursday</text>
        <text x="30" y="262" font-size="190" font-weight="700">1</text>
        <text x="40" y="318" font-size="30">October 2026</text>
        <rect x="290" y="40" width="2" height="350"/>
        <g font-size="26">
          <text x="324" y="84" font-weight="700">08:30</text><text x="420" y="84">Dentist, Dr. Okafor</text>
          <text x="324" y="140" font-weight="700">12:00</text><text x="420" y="140">Lunch with Mirela</text>
          <text x="324" y="196" font-weight="700">15:15</text><text x="420" y="196">School pickup</text>
          <text x="324" y="252" font-weight="700">19:00</text><text x="420" y="252">Climbing gym</text>
        </g>
        <rect x="324" y="290" width="436" height="2" fill="url(#d50)"/>
        <text x="324" y="340" font-size="22" font-weight="700">Tomorrow</text>
        <text x="324" y="376" font-size="22">Recycling out, 07:00</text>
        <rect y="420" width="800" height="2"/>
        <text x="40" y="460" font-size="22" font-weight="700">Calendar</text>
        <text x="760" y="460" font-size="22" text-anchor="end">Kitchen</text>
      </g>
    </symbol>

    <symbol id="s-weather" viewBox="0 0 800 480">
      <g fill="#0a0a0a" font-family="Helvetica, Arial, sans-serif">
        <text x="34" y="220" font-size="200" font-weight="700">14°</text>
        <text x="40" y="290" font-size="34" font-weight="700">Rain from 15:00</text>
        <text x="40" y="334" font-size="24">High 16°, low 9°, wind 18 km/h</text>
        <g>
          <rect x="440" y="250" width="32" height="90" fill="url(#d25)"/>
          <rect x="484" y="230" width="32" height="110" fill="url(#d25)"/>
          <rect x="528" y="200" width="32" height="140" fill="url(#d50)"/>
          <rect x="572" y="150" width="32" height="190" fill="url(#d50)"/>

<script>
const variants = [

  { key: 'b', name: 'Masthead' },
  { key: 'c', name: 'Contents' },

const allDevices = [
  { id: 'kitchen', name: 'Kitchen', seen: '4 min ago', seenShort: '4 min', battery: '18 %', signal: '−61 dBm', sleep: '23:00–06:00', current: 'calendar', screens: ['weather', 'calendar', 'photo', 'trains', 'mashup'] },
  { id: 'hallway', name: 'Hallway', seen: '11 min ago', seenShort: '11 min', battery: '76 %', signal: '−58 dBm', sleep: 'Off', current: 'weather', screens: ['weather', 'trains'] },
  { id: 'study', name: 'Study', seen: '2 h ago', seenShort: '2 h', battery: '54 %', signal: '−72 dBm', sleep: '22:00–07:00', current: 'photo', screens: ['photo', 'mashup'] },
]

const screenKinds = {

  calendar: { name: 'Calendar', kind: 'Plugin', days: [1, 1, 1, 1, 1, 0, 0], time: '06:00–09:00' },
  photo: { name: 'Harbour photo', kind: 'File', days: [1, 1, 1, 1, 1, 1, 1], time: null },
  trains: { name: 'Train departures', kind: 'Plugin', days: [1, 1, 1, 1, 1, 0, 0], time: '06:30–08:30', off: true },
  mashup: { name: 'Weekend board', kind: 'Mashup', days: [0, 0, 0, 0, 0, 1, 1], time: null },
}

const plugins = [
  { id: 'weather', name: 'Weather', kind: 'Poll', origin: 'Recipe 48213', devices: '2 Devices' },
  { id: 'calendar', name: 'Calendar', kind: 'Poll', origin: 'Built here', devices: '1 Device' },
  { id: 'trains', name: 'Train departures', kind: 'Poll', origin: 'Built here', devices: '2 Devices', streak: 'Fetch Failure Streak 2' },
  { id: 'doorbell', name: 'Doorbell note', kind: 'Webhook', origin: 'Built here', devices: 'Not on a Device' },
]

const instancePages = [
  { id: 'settings', name: 'Instance Settings', gist: 'Alert Rule thresholds and Firmware Auto-Update', intro: 'Values that apply to the whole instance. A value you have not set falls back to its environment variable, then to the built-in default.', rows: [['Battery low Alert Rule', 'below 20 %', 'Change'], ['Device offline Alert Rule', 'after 30 min without a poll', 'Change'], ['Data Source fetch-failure Alert Rule', 'Fetch Failure Streak of 3', 'Change'], ['Firmware Auto-Update', 'Off', 'Switch on']] },
  { id: 'firmware', name: 'Firmware', gist: 'The Firmware library: sync, upload, delete', intro: 'Every Firmware a Device can be pushed to. A Device\'s own target Firmware is set on that Device.', actions: ['Upload Firmware', 'Sync now'], rows: [['1.6.9', 'official-synced · all Device Models', 'Delete'], ['1.6.8', 'official-synced · all Device Models', 'Delete'], ['1.7.0-rc2', 'custom · TRMNL OG', 'Delete'], ['Firmware Auto-Update', 'Off', 'Switch on']] },
  { id: 'models', name: 'Device Models and Palettes', gist: 'Panel sizes, and the Palettes they can use', intro: 'The panels Kuroshiro can render for, and the Palettes offered on each.', actions: ['New Palette'], rows: [['TRMNL OG', '800 × 480 · 1-bit, 2-bit', 'Open'], ['TRMNL X', '1872 × 1404 · 4-bit', 'Open'], ['Warm paper', 'custom Palette · 2-bit', 'Edit']] },
  { id: 'archive', name: 'Configuration Archive', gist: 'Configuration Export and Configuration Import', intro: 'One zip holding every Plugin, Device, Screen, Mashup, custom Palette and overridden Instance Setting.', rows: [['Configuration Export', 'with secrets', 'Export'], ['Redacted Archive', 'secrets replaced, safe to share', 'Export'], ['Configuration Import', 'into this instance', 'Choose file']] },
  { id: 'housekeeping', name: 'Housekeeping', gist: 'Storage cleanup, Retention run, Test Notification', intro: 'Jobs you can run by hand. They also run on their own.', rows: [['Storage cleanup', '412 MB in 3 108 rendered images', 'Clean up'], ['Retention run', 'last ran today 03:00', 'Run now'], ['Test Notification', 'through the Apprise sidecar', 'Send']] },
  { id: 'virtual-device', name: 'Virtual Device', gist: 'Poll the server as a Device would, to troubleshoot', intro: 'Polls this server exactly as a Device does. Each poll advances that Device\'s Rotation and counts as "last seen".', rows: [['Device', 'Kitchen', 'Change'], ['Poll', 'advances Rotation by one Screen', 'Poll now']] },
]

const params = new URLSearchParams(location.search)
const pick = (key, allowed, fallback) => allowed.includes(params.get(key)) ? params.get(key) : fallback
const state = {
  variant: pick('variant', ['a', 'b', 'c'], 'a'),
  theme: pick('theme', ['light', 'dark'], matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'),
  devices: Number(pick('devices', ['0', '1', '3'], '1')),
  alert: pick('alert', ['0', '1'], '1') === '1',
  menuOpen: false,
  arrived: false,
}

const devices = () => allDevices.slice(0, state.devices)
const firing = () => state.alert && state.devices > 0
const hasAlert = d => firing() && d.id === 'kitchen'
const cap = s => s[0].toUpperCase() + s.slice(1)
const icon = id => `<svg class="icon" aria-hidden="true"><use href="#${id}"/></svg>`
const seal = (size, red = false) => `<svg class="seal ${red ? 'red' : ''}" width="${size}" height="${size}" aria-hidden="true"><use href="#seal" fill="currentColor"/></svg>`
const thumb = id => `<div class="thumb"><svg aria-hidden="true"><use href="#s-${id}"/></svg></div>`
const current = on => on ? 'aria-current="page"' : ''
const stub = text => `<p class="stub">Stub. ${text}</p>`
const setRows = rows => `<ul class="rows">${rows.map(([label, value, action]) => `<li class="set"><b>${label}</b><span class="mono">${value}</span>${action ? `<button class="btn quiet">${action}</button>` : ''}</li>`).join('')}</ul>`
const alertLink = () => firing() ? `<a class="alertlink" href="#/alerts">1 Alert firing</a>` : ''
const lock = href => `<a class="lock" href="${href}">${seal(26)}<span class="word">Kuroshiro</span></a>`

/* ── pages: shared by every shell ── */

function screensView(d) {
  const now = screenKinds[d.current]
  const rows = d.screens.map((id, i) => {
    const s = screenKinds[id]
    const stateClass = id === d.current ? 'active' : s.off ? 'off' : ''
    const scheduled = s.time !== null || s.days.includes(0)
    return `
      <li class="srow ${stateClass}">
        <button class="grip" aria-label="Reorder ${s.name}">${icon('i-grip')}</button>
        <span class="ord">${i + 1}</span>
        ${thumb(id)}
        <span><span class="name">${s.name}</span><span class="kind">${s.kind}</span></span>
        <span class="sched">${scheduled ? `<span class="days">${s.days.map((on, n) => on ? `<b>${'MTWTFSS'[n]}</b>` : '·').join('')}</span><span>${s.time ?? 'all day'}</span>` : 'Always shown'}</span>
        <span class="state">${id === d.current ? `${seal(14, true)}Active Screen` : s.off ? 'Schedule off' : ''}</span>
        <button class="menu" aria-label="Menu for ${s.name}">${icon('i-menu')}</button>
      </li>`
  }).join('')
  return `
    <dl class="facts">
      <div><dt>Last seen</dt><dd>${d.seen}</dd></div>
      <div><dt>${hasAlert(d) ? 'Alert: battery low' : 'Battery'}</dt><dd ${hasAlert(d) ? 'class="fault"' : ''}>${d.battery}</dd></div>
      <div><dt>Signal</dt><dd>${d.signal}</dd></div>
      <div><dt>Sleep Mode</dt><dd>${d.sleep}</dd></div>
    </dl>
    <figure class="now">
      <div class="plate"><svg role="img" aria-label="Current Screen: ${now.name}"><use href="#s-${d.current}"/></svg></div>
      ${seal(48, true)}
      <figcaption><span><b>${now.name}</b> is the Current Screen</span><span>Rendered 07:42, on the panel at its next poll</span></figcaption>
    </figure>
    <h2 class="h2">Screens in Order</h2>
    <ol class="rows">${rows}</ol>
    ${stub('This view gets its own gate, "Device details hero screen". Here it only fills the frame.')}`
}

const settingsView = d => `
  <h2 class="h2" style="margin-top:28px">Display</h2>
  ${setRows([['Device Model', 'TRMNL OG · 800 × 480', 'Change'], ['Palette', '2-bit greyscale', 'Change'], ['Refresh rate', 'every 15 min', 'Change']])}
  <h2 class="h2">Sleep Mode</h2>
  ${setRows([['Window', d.sleep, 'Change']])}
  <h2 class="h2">Firmware</h2>
  ${setRows([['Reported version', '1.6.8'], ['Target Firmware', '1.6.9 · official-synced', 'Update now']])}
  <p class="mid" style="margin-top:10px">The <a href="#/instance/firmware">Firmware library</a> lives under Instance.</p>
  <h2 class="h2">Mirroring</h2>
  ${setRows([['Mirrors', 'no other Device', 'Change']])}
  <details class="tucked"><summary>Identity and credentials</summary>${setRows([['Friendly id', '4F2A1C'], ['MAC address', 'A4:CF:12:4F:2A:1C'], ['API key', '••••••••••••a91e', 'Reveal']])}</details>
  <details class="tucked"><summary>Special Functions</summary><p class="mid">Reaches the Device on its next poll.</p><p style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn">identify</button><button class="btn">sleep</button><button class="btn">add_wifi</button><button class="btn">rewind</button></p></details>
  <details class="tucked"><summary>Reset or delete ${d.name}</summary><p class="mid">Reset keeps the Device and removes its Screens. Delete removes the Device, its Screens and their Schedules.</p><p style="display:flex;gap:8px"><button class="btn">Reset ${d.name}</button><button class="btn">Delete ${d.name}</button></p></details>`

const logsView = () => `
  <ol class="logs rows">
    ${[['07:42:10', 'info', 'display poll, served Calendar (Order 2)'], ['07:27:08', 'info', 'display poll, served Weather (Order 1)'], ['07:12:07', 'warn', 'battery 3.42 V, below the low-battery threshold'], ['07:12:07', 'info', 'display poll, served Weekend board skipped: Schedule does not match'], ['06:57:05', 'info', 'woke from Sleep Mode'], ['23:00:01', 'info', 'Sleep Mode until 06:00, refresh_rate 25 200 s']].map(([t, l, m]) => `<li><time>${t}</time><span class="lvl">${l}</span><span>${m}</span></li>`).join('')}
  </ol>`

function devicePage(d, view) {
  return {
    section: 'devices', deviceId: d.id, title: d.name, parents: [],
    sub: ['screens', 'settings', 'logs'].map(v => ({ label: cap(v), href: `#/devices/${d.id}/${v}`, current: v === view })),
    subLabel: `${d.name} views`,
    actions: view === 'screens' ? '<button class="btn primary">Add Screen</button>' : '',
    body: { screens: screensView, settings: settingsView, logs: logsView }[view](d),
  }
}

const deviceRows = () => devices().map(d => `
  <li><a class="drow" href="#/devices/${d.id}">
    ${thumb(d.current)}
    <span><span class="dname">${d.name}</span><span class="dfacts">${hasAlert(d) ? '<span class="fault">Alert: battery low</span> · ' : ''}Last seen ${d.seen} · Battery ${d.battery} · ${screenKinds[d.current].name}</span></span>
  </a></li>`).join('')

const devicesPage = () => ({
  section: 'devices', title: 'Devices', parents: [],
  actions: '<a class="btn" href="#/connect">Connect a Device</a>',
  body: `<ul class="rows" style="margin-top:20px">${deviceRows()}</ul>`,
})

const pluginRows = () => plugins.map(p => `
  <li class="prow">
    <a class="name" href="#/plugins/${p.id}">${p.name}</a>
    <span>${p.kind}</span><span>${p.origin}</span>
    <span class="${p.streak ? 'streak' : ''}">${p.streak ?? p.devices}</span>
    <button class="menu" aria-label="Menu for ${p.name}: duplicate, export, delete">${icon('i-menu')}</button>
  </li>`).join('')

const pluginsPage = () => ({
  section: 'plugins', title: 'Plugins', parents: [],
  actions: '<button class="btn">New Plugin</button><button class="btn primary">Import a Recipe</button>',
  body: `<ul class="rows" style="margin-top:20px">${pluginRows()}</ul>${stub('Row anatomy and the create flows are specced with the Plugins surfaces.')}`,
})

const pluginPage = p => ({
  section: 'plugins', title: p.name, parents: [{ label: 'Plugins', href: '#/plugins' }],
  actions: '<button class="btn primary">Save</button>',
  body: `
    <div class="editor">
      <div><h2 class="h2" style="margin-top:28px">Template</h2><div class="code">&lt;div class="layout"&gt;
  &lt;span class="value value--xxlarge"&gt;{{ temp }}°&lt;/span&gt;
  &lt;span class="title"&gt;{{ summary }}&lt;/span&gt;
&lt;/div&gt;</div></div>
      <div><h2 class="h2" style="margin-top:28px">Preview</h2><figure class="now"><div class="plate"><svg role="img" aria-label="Preview"><use href="#s-${screenKinds[p.id] ? p.id : 'weather'}"/></svg></div></figure></div>

function instancePage(sub) {
  const p = instancePages.find(x => x.id === sub)
  return {
    section: 'instance', title: p.name, parents: [{ label: 'Instance', href: '#/instance' }],
    sub: instancePages.map(x => ({ label: x.name, href: `#/instance/${x.id}`, current: x.id === sub })),

    body: setRows(p.rows),

}

const instanceRows = () => instancePages.map(p => `<li><a class="irow" href="#/instance/${p.id}"><b>${p.name}</b><span>${p.gist}</span></a></li>`).join('')

const instanceIndexPage = () => ({
  section: 'instance', title: 'Instance', parents: [],

    ${firing()
      ? `<ul class="rows"><li class="arow"><b><span class="fault">Battery low</span> on Kitchen</b><p>18 %, below the 20 % threshold since 06:10.</p><a class="btn" href="#/devices/kitchen">Open Kitchen</a></li></ul>`

    <ul class="rows"><li class="arow"><b>Data Source fetch failing on Train departures</b><p>Fired yesterday 16:40, resolved yesterday 18:20 after a successful fetch.</p><a class="btn" href="#/plugins/trains">Open Train departures</a></li></ul>`,

const connectPage = () => ({
  section: 'connect', title: state.devices === 0 ? 'Connect your Device' : 'Connect a Device', parents: [], firstRun: state.devices === 0,
  body: `
    <p class="lede">Enter this server URL on the Device's Wi-Fi setup page. The Device shows up here the moment it calls in.</p>
    <div class="url"><code>http://kuroshiro.local:3000</code><button class="btn primary">Copy URL</button></div>
    ${state.arrived
      ? `<div class="arrived"><div class="thumb"><svg aria-hidden="true"><use href="#s-welcome"/></svg>${seal(30, true)}</div><div><b>A Device called in</b><span class="mono mid">4F2A1C · Firmware 1.6.9 · TRMNL OG</span><br><a class="btn primary" href="#/devices/kitchen">Open Kitchen</a></div></div>`
      : `<p class="waiting"><i></i>Waiting for a Device to call in</p>${state.devices === 0 ? '<p class="mid" style="margin-top:4px">Prototype: press <b>d</b> to let one call in.</p>' : ''}`}

    <details class="tucked" style="max-width:720px"><summary>Register a Device by hand</summary>
      <label class="field"><span>MAC address</span><input placeholder="A4:CF:12:00:00:00"></label>
      <label class="field"><span>Name</span><input placeholder="Kitchen"></label>
      <p><button class="btn">Register Device</button></p>
    </details>`,
})

const contentsPage = () => ({
  section: 'contents', title: '', parents: [],

    <h2 class="h2" style="margin-top:0"><span>Devices</span><a class="btn quiet" href="#/connect">Connect a Device</a></h2>
    ${state.devices ? `<ul class="rows">${deviceRows()}</ul>` : '<p class="mid" style="padding:12px 0">No Device has called in yet. <a href="#/connect">Connect your Device</a>.</p>'}

    <ul class="rows cols">${plugins.map(p => `<li><a class="irow" href="#/plugins/${p.id}"><b>${p.name}</b><span>${p.streak ?? p.kind}</span></a></li>`).join('')}</ul>
    <h2 class="h2"><a href="#/instance">Instance</a></h2>
    <ul class="rows">${instanceRows()}</ul>`,
})

function resolve() {
  const [a, b, c] = (location.hash.replace(/^#/, '') || '/').split('/').filter(Boolean)
  const list = devices()
  const landing = () => list.length === 0
    ? connectPage()
    : list.length === 1
      ? devicePage(list[0], 'screens')
      : state.variant === 'c' ? contentsPage() : devicesPage()
  if (a === 'devices' && b && list.some(d => d.id === b))
    return devicePage(list.find(d => d.id === b), ['screens', 'settings', 'logs'].includes(c) ? c : 'screens')
  if (a === 'connect')
    return connectPage()
  if (a === 'plugins')
    return plugins.some(p => p.id === b) ? pluginPage(plugins.find(p => p.id === b)) : pluginsPage()
  if (a === 'instance')
    return instancePages.some(p => p.id === b) ? instancePage(b) : state.variant === 'c' ? instanceIndexPage() : instancePage('settings')
  if (a === 'alerts')
    return alertsPage()
  if (a === 'contents' && state.variant === 'c')
    return contentsPage()
  return landing()
}

/* ── shells: each owns navigation and the page frame ── */

const intro = page => page.intro ? `<p class="lede">${page.intro}</p>` : ''
const head = page => page.title ? `<div class="head"><h1>${page.title}</h1><div class="actions">${page.actions ?? ''}</div></div>${intro(page)}` : ''
const tabs = page => page.sub ? `<nav class="tabs" aria-label="${page.subLabel}">${page.sub.map(s => `<a href="${s.href}" ${current(s.current)}>${s.label}</a>`).join('')}</nav>` : ''
const nest = page => `<div class="nest">${page.sub.map(s => `<a class="item" href="${s.href}" ${current(s.current)}>${s.label}</a>`).join('')}</div>`

function shellA(page) {
  const deviceItems = devices().map((d) => {
    const open = page.deviceId === d.id
    return `<a class="item ${open ? 'open' : ''}" href="#/devices/${d.id}">${d.name} <small>${d.seenShort}</small></a>${open ? nest(page) : ''}`
  }).join('')
  const where = [...page.parents.map(p => p.label), page.title, page.deviceId ? page.sub.find(s => s.current).label : ''].filter(Boolean).join(' / ')
  return `
    <div class="A ${state.menuOpen ? 'menu-open' : ''}">
      <header class="A-top">
        <a href="#/" aria-label="Kuroshiro">${seal(26)}</a>
        <span class="where">${where}</span>
        ${firing() ? '<a class="alertlink" href="#/alerts" aria-label="1 Alert firing">1</a>' : ''}
        <button class="btn" data-menu>Menu</button>
      </header>
      <aside class="A-rail">
        ${lock('#/')}
        <button class="btn close" data-menu>Close</button>
        <h2>Devices</h2>
        ${deviceItems || '<span class="item add">None yet</span>'}
        <a class="item add" href="#/connect" ${current(page.section === 'connect')}>Connect a Device</a>
        <hr>
        <a class="item" href="#/plugins" ${current(page.section === 'plugins')}>Plugins</a>
        <a class="item ${page.section === 'instance' ? 'open' : ''}" href="#/instance">Instance</a>
        ${page.section === 'instance' ? nest(page) : ''}
        <div class="foot">${alertLink()}</div>
      </aside>
      <main class="A-main"><div>
        ${head(page)}
        ${page.deviceId ? tabs(page) : ''}
        ${page.body}
      </div></main>
    </div>`
}

function shellB(page) {
  const list = devices()
  const body = page.subIsSection
    ? `<div class="B-split"><nav aria-label="${page.subLabel}">${page.sub.map(s => `<a class="item" href="${s.href}" ${current(s.current)}>${s.label}</a>`).join('')}</nav><div><h2 class="h2"><span>${page.title}</span><span class="actions">${page.actions}</span></h2>${intro(page)}${page.body}</div></div>`
    : `${tabs(page)}${page.body}`
  const title = page.subIsSection ? { ...page, title: 'Instance', actions: '', intro: '' } : page
  const devicesTab = list.length === 1 ? list[0].name : 'Devices'
  return `
    <div class="B">
      <header class="B-bar">
        ${lock('#/')}
        <nav aria-label="Sections">
          ${list.map(d => `<a href="#/devices/${d.id}" ${current(page.deviceId === d.id)}>${d.name}</a>`).join('')}
          <a href="#/connect" ${current(page.section === 'connect')}>Connect a Device</a>
          <i></i>
          <a href="#/plugins" ${current(page.section === 'plugins')}>Plugins</a>
          <a href="#/instance" ${current(page.section === 'instance')}>Instance</a>
        </nav>
        ${alertLink()}
      </header>
      <main class="B-col">
        ${head(title)}
        ${body}
      </main>
      <nav class="B-tabs" aria-label="Sections">
        <a href="#/" ${current(['devices', 'connect'].includes(page.section))}>${list.length ? devicesTab : 'Connect'}</a>
        <a href="#/plugins" ${current(page.section === 'plugins')}>Plugins</a>
        <a href="#/instance" ${current(page.section === 'instance')}>Instance</a>
      </nav>
    </div>`
}

function shellC(page) {
  const home = state.devices === 1 ? '#/contents' : '#/'
  return `
    <div class="C">
      <header class="C-head">
        <a class="lock" href="${home}" aria-label="Kuroshiro, contents">${seal(26)}<span class="word">Kuroshiro</span></a>
        ${page.parents.map(p => `<a class="crumb" href="${p.href}">${p.label}</a>`).join('')}
        ${alertLink()}
      </header>
      <main>
        ${head(page)}
        ${page.deviceId ? tabs(page) : ''}
        ${page.body}
      </main>
    </div>`
}

/* ── prototype plumbing ── */

function render() {
  const variant = variants.find(v => v.key === state.variant)
  const page = resolve()
  document.documentElement.className = state.theme
  document.querySelector('#app').innerHTML = { a: shellA, b: shellB, c: shellC }[state.variant](page)
  document.title = `PROTOTYPE: ${page.title || 'Contents'} · ${variant.name}`
  document.querySelector('[data-label]').textContent = `${variant.key.toUpperCase()} — ${variant.name}`
  document.querySelector('[data-cycle="theme"]').textContent = state.theme === 'light' ? 'Light' : 'Dark'
  document.querySelector('[data-cycle="devices"]').textContent = state.devices === 0 ? 'First-run' : `${state.devices} Device${state.devices > 1 ? 's' : ''}`
  document.querySelector('[data-cycle="alert"]').textContent = state.alert ? 'Alert firing' : 'No Alert'
  const query = new URLSearchParams({ variant: state.variant, theme: state.theme, devices: state.devices, alert: state.alert ? 1 : 0 })
  history.replaceState(null, '', `?${query}${location.hash}`)
}

const cycles = {
  theme: () => { state.theme = state.theme === 'light' ? 'dark' : 'light' },
  devices: () => {
    state.arrived = state.devices === 0 && resolve().section === 'connect'
    state.devices = { 0: 1, 1: 3, 3: 0 }[state.devices]
    if (state.arrived)
      location.hash = '#/connect'
  },
  alert: () => { state.alert = !state.alert },
}

function step(delta) {
  const index = variants.findIndex(v => v.key === state.variant)
  state.variant = variants[(index + delta + variants.length) % variants.length].key
  state.menuOpen = false
  render()
}

function cycle(name) {
  cycles[name]()
  render()
}

document.querySelectorAll('[data-step]').forEach(b => b.addEventListener('click', () => step(Number(b.dataset.step))))
document.querySelectorAll('[data-cycle]').forEach(b => b.addEventListener('click', () => cycle(b.dataset.cycle)))
document.querySelector('#app').addEventListener('click', (e) => {
  if (e.target.closest('[data-menu]')) {
    state.menuOpen = !state.menuOpen
    render()
  }
})
addEventListener('hashchange', () => {
  state.menuOpen = false
  if (location.hash !== '#/connect')
    state.arrived = false
  render()
  scrollTo(0, 0)
})
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea, [contenteditable]') || e.metaKey || e.ctrlKey || e.altKey)
    return
  const keys = { ArrowLeft: () => step(-1), ArrowRight: () => step(1), t: () => cycle('theme'), d: () => cycle('devices'), a: () => cycle('alert') }
  keys[e.key]?.()
  if (e.key === 'Escape' && state.menuOpen) {
    state.menuOpen = false
    render()
  }
})

render()
</script>
</body>
</html>
