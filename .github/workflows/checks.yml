name: Checks

on:
  workflow_call:
  pull_request:
    branches: [main, 'release/**']

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for the UI's browser-mode tests
        run: pnpm --filter kuroshiro-ui exec playwright install --with-deps --only-shell chromium
      - name: Check ADR numbers
        run: pnpm run adr:check
      - name: Lint
        run: pnpm run lint
      - name: Type Check
        run: pnpm run type-check
      - name: Fallow (dead code, duplication, complexity)
        run: pnpm run fallow:ci
      - name: Test
        run: pnpm run test
      - name: Build
        run: pnpm run build

  ui-screenshots:
    name: UI screenshots
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Compare screenshots with their baselines in the pinned Playwright image
        run: pnpm --filter kuroshiro-ui run test:screenshots
      - name: Upload the shots that differ
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshot-diffs
          path: packages/ui/.vitest/attachments
          include-hidden-files: true
          if-no-files-found: ignore

  ui-real-api:
    name: UI against the real API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter kuroshiro-ui exec playwright install --with-deps --only-shell chromium
      # The API converts every Screen image with `magick`, as the image has it; the runner only offers ImageMagick 6.
      - name: Install ImageMagick 7
        env:
          IMAGEMAGICK_VERSION: 7.1.2-32
        run: |
          curl -fsSL -o "$RUNNER_TEMP/magick.AppImage" "https://github.com/ImageMagick/ImageMagick/releases/download/$IMAGEMAGICK_VERSION/ImageMagick-$IMAGEMAGICK_VERSION-gcc-x86_64.AppImage"
          chmod +x "$RUNNER_TEMP/magick.AppImage"
          cd "$RUNNER_TEMP" && ./magick.AppImage --appimage-extract > /dev/null
          sudo mv "$RUNNER_TEMP/squashfs-root" /opt/imagemagick
          printf '#!/bin/sh\nexec /opt/imagemagick/AppRun "$@"\n' | sudo tee /usr/local/bin/magick > /dev/null
          sudo chmod +x /usr/local/bin/magick
          magick -version
      - name: Drive the built UI against the real API and Postgres
        run: pnpm --filter kuroshiro-ui run test:real-api
        env:
          KUROSHIRO_DB_HOST: localhost
          KUROSHIRO_DB_PORT: 5432
          KUROSHIRO_DB_USER: test
          KUROSHIRO_DB_PASSWORD: test
          KUROSHIRO_DB_DB: test
