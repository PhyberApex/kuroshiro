name: Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  playwright-image:
    name: Pinned Playwright image
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      name: ${{ steps.pin.outputs.name }}
    steps:
      - name: Checkout the workspace catalog
        uses: actions/checkout@v7
        with:
          sparse-checkout: pnpm-workspace.yaml
          sparse-checkout-cone-mode: false
      - id: pin
        run: echo "name=mcr.microsoft.com/playwright:v$(awk '$1 == "playwright:" { print $2 }' pnpm-workspace.yaml)-noble" >> "$GITHUB_OUTPUT"

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: playwright-image
    # The image ships the browsers and their system libraries the catalog's Playwright expects,
    # so nothing is downloaded or apt-installed on the runner.
    container:
      image: ${{ needs.playwright-image.outputs.name }}
      options: --ipc=host
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm run test:coverage

      - name: Upload api coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/api/coverage/lcov.info
          flags: api
          name: api-coverage
          fail_ci_if_error: true

      - name: Upload shared coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/shared/coverage/lcov.info
          flags: shared
          name: shared-coverage
          fail_ci_if_error: true

      - name: Upload ui coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/ui/coverage/lcov.info
          flags: ui
          name: ui-coverage
          fail_ci_if_error: true
