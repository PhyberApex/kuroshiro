name: Release Please

on:
  push:
    branches:
      - main
      - release/**

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Release Please
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GH_PAT }}
          target-branch: ${{ github.ref_name }}
